name: Feature request
description: An idea to make ShellNote better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other ways
      description: Anything you tried instead, or how other apps do it.
