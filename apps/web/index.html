<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Shell Note — Note-Taking App for Humans and AI Agents</title>

    <meta
      name="description"
      content="Shell Note is an AI-native note-taking workspace where humans and AI work together. Use local LLMs, AI agents and your apps in one place."
    />

    <meta name="theme-color" content="#0b0b0b" />
    <meta name="application-name" content="Shell Note" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://shellnote.app/" />

    <!-- Open Graph / Discord / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shell Note" />
    <meta
      property="og:title"
      content="Shell Note — Note-Taking App for Humans and AI Agents"
    />
    <meta
      property="og:description"
      content="Bring your notes, local LLMs, AI agents and everyday applications into one connected workspace."
    />
    <meta property="og:url" content="https://shellnote.app/" />
    <meta property="og:image" content="https://shellnote.app/og-image.png" />
    <meta property="og:image:width" content="1774" />
    <meta property="og:image:height" content="887" />
    <meta
      property="og:image:alt"
      content="Shell Note — Note-Taking App for Humans and AI Agents"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Shell Note — Note-Taking App for Humans and AI Agents"
    />
    <meta
      name="twitter:description"
      content="Your notes, local LLMs, AI agents and applications in one connected workspace."
    />
    <meta name="twitter:image" content="https://shellnote.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Shell Note — Note-Taking App for Humans and AI Agents"
    />

    <!-- Structured Data: the site's name and the app. Data for search engines, which a browser never runs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://shellnote.app/#website",
            "name": "Shell Note",
            "alternateName": "ShellNote",
            "url": "https://shellnote.app/"
          },
          {
            "@type": "WebApplication",
            "@id": "https://shellnote.app/#app",
            "name": "Shell Note",
            "url": "https://shellnote.app/",
            "description": "Shell Note is an AI-native note-taking workspace where humans and AI work together. Use local LLMs, AI agents and your apps in one place.",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "image": "https://shellnote.app/og-image.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <!-- The page's own heading, outside the app's root so the app never draws over it; kept off the screen (app.css). -->
    <h1 class="page-heading">Shell Note: a note-taking app for humans and AI agents</h1>

    <!-- Before the app's root, which fills the window: without JavaScript these words are what shows, at the top. -->
    <noscript>
      <p>
        Shell Note is a note-taking app for humans and AI agents: type, write by hand and draw on real pages, with
        local LLMs, AI agents and your apps in one place.
      </p>
      <p>
        It runs in your browser and needs JavaScript.
        Its code is on <a href="https://github.com/Akshat-Kumar-dot/Shell-Note">GitHub</a>.
      </p>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
